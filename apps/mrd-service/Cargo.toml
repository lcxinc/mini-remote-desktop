[package]
name = "mrd-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mrd_service"
path = "src/lib.rs"

[[bin]]
name = "mrd-service"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
ed25519-dalek.workspace = true
anyhow.workspace = true
axum = { workspace = true, features = ["ws"] }
common-control-proto = { path = "../../common-control-proto" }
mrd-application = { path = "../../crates/mrd-application" }
mrd-agent-ipc = { path = "../../crates/mrd-agent-ipc" }
thiserror.workspace = true
time = { version = "0.3", features = ["parsing"] }
mrd-decode = { path = "../../crates/mrd-decode" }
mrd-encode-openh264 = { path = "../../crates/mrd-encode-openh264" }
mrd-encode-vvenc = { path = "../../crates/mrd-encode-vvenc", optional = true }
mrd-ffmpeg = { path = "../../crates/mrd-ffmpeg" }
mrd-input = { path = "../../crates/mrd-input" }
mrd-identity = { path = "../../crates/mrd-identity" }
mrd-ipc = { path = "../../crates/mrd-ipc" }
mrd-pipeline-core = { path = "../../crates/mrd-pipeline-core" }
mrd-proto = { path = "../../crates/mrd-proto" }
mrd-relay-control = { path = "../../crates/mrd-relay-control" }
mrd-render = { path = "../../crates/mrd-render" }
mrd-session = { path = "../../crates/mrd-session" }
mrd-signal-client = { path = "../../crates/mrd-signal-client" }
mrd-signal-proto = { path = "../../crates/mrd-signal-proto" }
mrd-store-sqlite = { path = "../../crates/mrd-store-sqlite" }
mrd-transport-quic-quinn = { path = "../../crates/mrd-transport-quic-quinn" }
mrd-transport-webrtc = { path = "../../crates/mrd-transport-webrtc" }
base64 = "0.22"
bytes.workspace = true
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
ring.workspace = true
reqwest = { workspace = true, features = ["stream"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo = "0.30"
tokio.workspace = true
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing.workspace = true
url = "2"
zeroize.workspace = true
tracing-subscriber.workspace = true
webrtc = { version = "0.12", optional = true }

[target.'cfg(windows)'.dependencies]
mrd-capture-dxgi = { path = "../../crates/mrd-capture-dxgi" }
mrd-capture-winrt = { path = "../../crates/mrd-capture-winrt" }
mrd-decode-nvdec = { path = "../../crates/mrd-decode-nvdec" }
mrd-encode-nvenc-av1 = { path = "../../crates/mrd-encode-nvenc-av1" }
mrd-encode-nvenc = { path = "../../crates/mrd-encode-nvenc" }
mrd-render-d3d11 = { path = "../../crates/mrd-render-d3d11" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Environment", "Win32_System_EventLog", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-service = "0.8.1"

[target.'cfg(target_os = "macos")'.dependencies]
mrd-capture-macos = { path = "../../crates/mrd-capture-macos" }
mrd-codec-videotoolbox = { path = "../../crates/mrd-codec-videotoolbox" }
mrd-render-macos = { path = "../../crates/mrd-render-macos" }
nix = { version = "0.29", features = ["socket"] }

[target.'cfg(target_os = "linux")'.dependencies]
mrd-capture-pipewire = { path = "../../crates/mrd-capture-pipewire", features = ["portal"] }
mrd-encode-nvenc = { path = "../../crates/mrd-encode-nvenc" }

[features]
default = []
browser-webrtc-preview = ["dep:webrtc"]
production-vvc-software-codec = [
  "dep:mrd-encode-vvenc",
  "mrd-decode/production-vvc-software-codec",
  "mrd-encode-vvenc/production-vvc-software-codec",
]

[dev-dependencies]
realtime-server = { path = "../realtime-server" }
rusqlite.workspace = true
