[package]
name = "integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "full_pipeline_test"
path = "full_pipeline_test.rs"

[[bin]]
name = "resolution_test"
path = "resolution_test.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
ed25519-dalek.workspace = true
mrd-agent-ipc = { path = "../../crates/mrd-agent-ipc" }
mrd-application = { path = "../../crates/mrd-application" }
mrd-pipeline-core = { path = "../../crates/mrd-pipeline-core" }
mrd-proto = { path = "../../crates/mrd-proto" }
mrd-relay-control = { path = "../../crates/mrd-relay-control" }
mrd-service = { path = "../../apps/mrd-service" }
mrd-session = { path = "../../crates/mrd-session" }
mrd-session-agent = { path = "../../apps/mrd-session-agent" }
mrd-encode-openh264 = { path = "../../crates/mrd-encode-openh264" }
mrd-decode = { path = "../../crates/mrd-decode" }
mrd-render = { path = "../../crates/mrd-render" }
mrd-transport-quic-quinn = { path = "../../crates/mrd-transport-quic-quinn" }
mrd-observability = { path = "../../crates/mrd-observability" }
serde_json.workspace = true
tokio.workspace = true
zeroize.workspace = true

[[test]]
name = "automated_e2e_pipeline"
path = "automated_e2e_pipeline.rs"

[[test]]
name = "automated_e2e_matrix"
path = "automated_e2e_matrix.rs"

[[test]]
name = "threaded_transport_e2e"
path = "threaded_transport_e2e.rs"

[[test]]
name = "service_agent_media"
path = "service_agent_media.rs"

[[test]]
name = "multi_region_relay"
path = "multi_region_relay.rs"

[target.'cfg(windows)'.dependencies]
mrd-capture-winrt = { path = "../../crates/mrd-capture-winrt" }
mrd-decode-nvdec = { path = "../../crates/mrd-decode-nvdec" }
mrd-encode-nvenc = { path = "../../crates/mrd-encode-nvenc" }
mrd-encode-nvenc-av1 = { path = "../../crates/mrd-encode-nvenc-av1" }
mrd-render-d3d11 = { path = "../../crates/mrd-render-d3d11" }

[target.'cfg(target_os = "macos")'.dependencies]
mrd-render-macos = { path = "../../crates/mrd-render-macos" }
