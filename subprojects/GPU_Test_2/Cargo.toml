[package]
name = "gpu-test-2"
version = "0.1.0"
edition = "2021"
description = "DXGI Desktop Duplication 示例 - 使用 Windows API 直接采集桌面"
license = "MIT"

[workspace]

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }
quinn = "0.11"
rustls = "0.23"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
rcgen = "0.13"
nvenc = "0.1"
openh264 = "0.9.3"
