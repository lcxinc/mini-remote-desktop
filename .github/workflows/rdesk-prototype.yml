name: Rdesk prototype
on:
  pull_request:
    paths: ['prototypes/rdesk/**', 'docs/repository-consolidation/Rdesk/**', 'scripts/verify_consolidation_346.py', '.github/workflows/rdesk-prototype.yml']
  push:
    branches: [main]
    paths: ['prototypes/rdesk/**', 'docs/repository-consolidation/Rdesk/**', 'scripts/verify_consolidation_346.py', '.github/workflows/rdesk-prototype.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: prototypes/rdesk/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_consolidation_346.py docs/repository-consolidation/Rdesk/manifest.json
      - run: npm ci --ignore-scripts
        working-directory: prototypes/rdesk
      - run: npm run build
        working-directory: prototypes/rdesk
